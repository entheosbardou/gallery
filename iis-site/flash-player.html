<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flash player</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{height:100%;margin:0;background:#111;color:#eee;font:14px/1.4 system-ui}body{display:flex;flex-direction:column}#player{flex:1;min-height:0;width:100%}ruffle-player{display:block;width:100%;height:100%}#message{padding:16px}#message[hidden],#controls[hidden]{display:none!important}#controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;background:#1b201b;border-top:1px solid #343d32}button{font:inherit;color:#f1f0e7;background:#242c23;border:1px solid #45503f;border-radius:6px;padding:8px 12px;cursor:pointer}button:hover{border-color:#dbb46e}button:focus-visible,input:focus-visible{outline:2px solid #dbb46e;outline-offset:2px}button:disabled{opacity:.5;cursor:default}.volume-control{display:flex;align-items:center;gap:8px}#volume{width:110px;accent-color:#dbb46e}#volume-value{min-width:35px;font-variant-numeric:tabular-nums}#playback-state{color:#c6cdbf;min-width:65px}#fullscreen{margin-left:auto}#seek-note{flex-basis:100%;color:#aeb6aa;font-size:12px}@media(max-width:500px){#controls{gap:8px;padding:8px}button{padding:8px}#volume{width:80px}#fullscreen{margin-left:0}#playback-state{min-width:0}}
</style></head><body><div id="message" role="status">Loading Flash file…</div><div id="player"></div><div id="controls" role="group" aria-label="Flash playback controls" hidden><button id="play-pause" type="button">Play</button><button id="restart" type="button">Restart</button><button id="mute" type="button" aria-pressed="false">Mute</button><label class="volume-control" for="volume">Volume <input id="volume" aria-label="Volume" type="range" min="0" max="100" step="1" value="100"><output id="volume-value" for="volume">100%</output></label><span id="playback-state" role="status" aria-live="polite">Paused</span><button id="fullscreen" type="button">Fullscreen</button><span id="seek-note">Seeking isn’t supported by this Flash player.</span></div><script src="/flash-player.js?v=controls-20261026"></script></body></html>
